<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>스도쿠</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스도쿠">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F2F3F7">
<meta name="description" content="광고 없는 조용한 스도쿠">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 게임 화면 -->
  <div id="game" hidden>
    <div id="stage" class="port">
      <div id="boardWrap">
        <div id="board" role="grid" aria-label="스도쿠 판"></div>
        <div id="pauseCover" hidden>
          <div class="pauseIcon" id="pauseBigIcon"></div>
          <div class="pauseTitle">일시정지</div>
          <button class="primary pill" id="btnResume">계속하기</button>
        </div>
      </div>
      <div id="side">
      <header id="hdr">
        <div id="info">
          <div id="infoText"><div id="diffName">보통</div><div id="mistakes">실수 0</div></div>
          <div id="timer">00:00</div>
        </div>
        <div id="hbtns">
          <button class="icon" id="btnPause" aria-label="일시정지"></button>
          <button class="icon" id="btnTheme" aria-label="화면 모드"></button>
          <button class="icon" id="btnMenu" aria-label="메뉴"></button>
        </div>
      </header>
      <div id="panel">
        <div id="tools">
          <button class="tool" id="btnUndo"><span class="ti"></span><span class="tl">되돌리기</span></button>
          <button class="tool" id="btnErase"><span class="ti"></span><span class="tl">지우기</span></button>
          <button class="tool" id="btnNotes"><span class="ti"></span><span class="tl" id="notesLabel">메모</span></button>
          <button class="tool" id="btnHint"><span class="ti"></span><span class="tl">힌트</span></button>
        </div>
        <div id="pad"></div>
      </div>
      </div>
    </div>
  </div>

  <!-- 메뉴 -->
  <div id="menu" hidden>
    <div class="menuInner">
      <div class="logo">
        <div class="logoImg" aria-hidden="true"></div>
        <h1>스도쿠</h1>
        <p>광고 없이 조용하게</p>
      </div>
      <button class="primary wide" id="btnContinue" hidden>이어하기</button>
      <h2>새 게임</h2>
      <div id="diffList"></div>
      <h2>화면 모드</h2>
      <div class="seg" id="themeSeg" role="radiogroup" aria-label="화면 모드">
        <button data-v="system" role="radio">시스템</button>
        <button data-v="light" role="radio">라이트</button>
        <button data-v="dark" role="radio">다크</button>
      </div>
      <button class="textBtn" id="btnCloseMenu" hidden>닫기</button>
    </div>
  </div>

  <!-- 완료 -->
  <div class="overlay" id="done" hidden>
    <div class="card">
      <div class="big">🎉</div>
      <h2 class="doneTitle">완료했어요!</h2>
      <div class="badge" id="newRecord" hidden>새로운 최고 기록</div>
      <div class="rows" id="doneRows"></div>
      <button class="primary wide" id="btnDoneNew">새 게임</button>
    </div>
  </div>

  <!-- 확인 -->
  <div class="overlay" id="confirm" hidden>
    <div class="card small">
      <p id="confirmMsg">진행 중인 게임이 사라져요.<br>새 게임을 시작할까요?</p>
      <div class="two">
        <button class="plain" id="confirmNo">취소</button>
        <button class="primary" id="confirmYes">시작</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="busy" hidden><div class="card small"><p>퍼즐을 만드는 중…</p></div></div>
  <div id="toast" hidden></div>
</div>
<script src="engine.js"></script>
<script src="game.js"></script>
<script src="app.js"></script>
</body>
</html>
